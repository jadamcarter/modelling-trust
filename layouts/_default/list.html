{{ define "main" }}
<div class="pagehead">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="dek">{{ . }}</p>{{ end }}
  </div>
</div>
<div class="wrap page">
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <ul class="newslist">
    {{- range .Pages.ByDate.Reverse }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>{{ with .Description }}<p>{{ . }}</p>{{ end }}</li>
    {{- end }}
  </ul>
</div>
{{ end }}
