# The co-leads on the People page, in this order. "url" is the link on the
# name and photo; "photo" is a square image in assets/img/people/.
- name: "J. Adam Carter"
  role: "Professor of Philosophy, University of Glasgow"
  photo: "img/people/carter.jpg"
  url: "https://www.jadamcarter.net/"
  link: "Personal website"
  bio: "A Director of COGITO Epistemology Research Centre. Works in social epistemology and the epistemology of trust, autonomy and testimony, and is the author of *A Telic Theory of Trust* (Oxford University Press, 2024). Principal Investigator of the ERC-funded KNOW-HOW project."
- name: "Nicolas Côté"
  role: "Lecturer in Applied Ethics, University of Glasgow"
  photo: "img/people/cote.jpg"
  url: "https://www.gla.ac.uk/schools/humanities/staff/nicolascote/"
  link: "University profile"
  bio: "Works across normative ethics, the philosophy of economics and political theory, and brings formal modelling into philosophical research. Leads the project’s modelling methodology."
- name: "Emma C. Gordon"
  role: "Reader in Philosophy, University of Glasgow"
  photo: "img/people/gordon.jpg"
  url: "https://emmacgordon.weebly.com/"
  link: "Personal website"
  bio: "Works in applied epistemology and bioethics, including trust in medicine and the ethics of expert advice, and is Head of Interdisciplinary Research at COGITO. Anchors the project’s work on monitoring and repairing trust."
